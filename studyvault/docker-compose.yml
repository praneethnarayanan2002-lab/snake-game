services:
  db:
    image: postgres:16-alpine
    container_name: studyvault-db
    environment:
      POSTGRES_USER: studyvault
      POSTGRES_PASSWORD: studyvault
      POSTGRES_DB: studyvault
    ports:
      - "${STUDYVAULT_DB_PORT:-5432}:5432"
    volumes:
      - studyvault-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyvault -d studyvault"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  studyvault-pg:
